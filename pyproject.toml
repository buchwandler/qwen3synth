[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3synth"
dynamic = ["version"]
description = "Qwen3-TTS synthesis and voice cloning directly from ONNX bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "qwen3synth contributors"}]
dependencies = ["numpy>=1.23", "onnxvoice>=0.2.8,<0.3"]
keywords = ["qwen3-tts", "tts", "onnx", "onnxruntime", "voice-cloning", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu]>=0.2.8,<0.3"]
gpu = ["onnxvoice[gpu]>=0.2.8,<0.3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.18",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
qwen3synth = "qwen3synth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen3synth*"]

[tool.setuptools.package-data]
qwen3synth = ["py.typed"]

[tool.setuptools_scm]
write_to = "qwen3synth/_version.py"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires downloaded Qwen3-TTS ONNX model assets",
    "resource_heavy: uses large model assets and substantial CPU/RAM",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["qwen3synth"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports_for_stubs = true


[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
